<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Users - Expense Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
    }
    .users-container {
      padding: 50px 0;
    }
    .user-card {
      background: white;
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      transition: transform 0.3s;
    }
    .user-card:hover {
      transform: translateY(-3px);
    }
    .user-icon {
      width: 50px;
      height: 50px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 20px;
    }
    .user-name {
      font-weight: 600;
      color: #333;
    }
    .user-email {
      color: #666;
      font-size: 14px;
    }
    .user-date {
      color: #999;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-pastel">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <i class="bi bi-wallet2"></i> Expense Tracker
      </a>
      <div class="ms-auto">
        <a href="index.html" class="btn btn-outline-primary btn-sm">
          <i class="bi bi-arrow-left"></i> Back to Transactions
        </a>
      </div>
    </div>
  </nav>

  <div class="users-container">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-8 col-md-10">
          <div class="text-center mb-4">
            <h2 style="color: white; font-weight: 700;">
              <i class="bi bi-people-fill"></i> All Users
            </h2>
            <p style="color: rgba(255,255,255,0.8);">Users registered in MongoDB</p>
          </div>

          <div id="usersList" class="mb-4">
            <div class="text-center">
              <div class="spinner-border text-light" role="status">
                <span class="visually-hidden">Loading...</span>
              </div>
              <p style="color: white;" class="mt-2">Loading users...</p>
            </div>
          </div>

          <div class="text-center">
            <button class="btn btn-light" onclick="loadUsers()">
              <i class="bi bi-arrow-clockwise"></i> Refresh Users
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'http://localhost:5000';

    // Load users on page load
    document.addEventListener('DOMContentLoaded', loadUsers);

    // Load all users from MongoDB
    async function loadUsers() {
      const usersList = document.getElementById('usersList');
      
      usersList.innerHTML = `
        <div class="text-center">
          <div class="spinner-border text-light" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
          <p style="color: white;" class="mt-2">Loading users...</p>
        </div>
      `;

      try {
        const response = await fetch(API_URL + '/Users');
        
        if (!response.ok) {
          throw new Error('Failed to fetch users');
        }
        
        const users = await response.json();
        displayUsers(users);
      } catch (error) {
        console.error('Error loading users:', error);
        usersList.innerHTML = `
          <div class="text-center" style="color: white;">
            <i class="bi bi-exclamation-circle" style="font-size: 48px;"></i>
            <p>Error loading users. Make sure backend is running!</p>
          </div>
        `;
      }
    }

    // Display users
    function displayUsers(users) {
      const usersList = document.getElementById('usersList');
      
      if (users.length === 0) {
        usersList.innerHTML = `
          <div class="text-center" style="color: white;">
            <i class="bi bi-people" style="font-size: 48px;"></i>
            <p>No users registered yet. Sign up to create one!</p>
          </div>
        `;
        return;
      }

      usersList.innerHTML = users.map((user, index) => `
        <div class="user-card" style="animation-delay: ${index * 0.1}s">
          <div class="d-flex align-items-center">
            <div class="user-icon me-3">
              <i class="bi bi-person-fill"></i>
            </div>
            <div class="flex-grow-1">
              <div class="user-name">${escapeHtml(user.name)}</div>
              <div class="user-email">
                <i class="bi bi-envelope"></i> ${escapeHtml(user.email)}
              </div>
              <div class="user-date">
                <i class="bi bi-calendar"></i> Created: ${new Date(user.createdAt).toLocaleDateString('en-US', { 
                year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' 
              })}
              </div>
            </div>
          </div>
        </div>
      `).join('');
    }

    // Escape HTML
    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
