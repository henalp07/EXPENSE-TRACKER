<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Expense Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-pastel">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <i class="bi bi-wallet2"></i> Expense Tracker
      </a>
    </div>
  </nav>

  <div class="auth-container">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-5 col-md-7 col-sm-9">
          <div class="auth-card p-4 p-lg-5">
            <div class="auth-icon">
              <i class="bi bi-person-plus-fill"></i>
            </div>
            <h2 class="auth-title mb-1">Create Account</h2>
            <p class="auth-subtitle mb-4">Join Expense Tracker today</p>

            <form id="signupForm" class="auth-form" novalidate>
              <div class="mb-3">
                <label for="name" class="form-label">Full Name</label>
                <div class="input-group input-group-auth">
                  <span class="input-group-text">
                    <i class="bi bi-person"></i>
                  </span>
                  <input type="text" class="form-control" id="name" placeholder="Enter your full name" required minlength="2">
                </div>
                <div class="invalid-feedback">Name must be at least 2 characters.</div>
              </div>

              <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <div class="input-group input-group-auth">
                  <span class="input-group-text">
                    <i class="bi bi-envelope"></i>
                  </span>
                  <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
                </div>
                <div class="invalid-feedback">Please enter a valid email address.</div>
              </div>

              <div class="mb-4">
                <label for="password" class="form-label">Password</label>
                <div class="input-group input-group-auth">
                  <span class="input-group-text">
                    <i class="bi bi-lock"></i>
                  </span>
                  <input type="password" class="form-control" id="password" placeholder="Create a password" required minlength="6">
                  <span class="password-toggle" onclick="togglePassword('password')">
                    <i class="bi bi-eye" id="toggleIconPassword"></i>
                  </span>
                </div>
                <div class="invalid-feedback">Password must be at least 6 characters.</div>
              </div>

              <button type="submit" class="btn btn-auth w-100 mb-3 auth-loading" id="signupBtn">
                <i class="bi bi-person-plus"></i> Create Account
              </button>
            </form>

            <div class="text-center">
              <p class="mb-0">Already have an account? <a href="login.html" class="auth-link fw-semibold">Sign in here</a></p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="liveToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="toast-header">
        <i class="bi bi-info-circle-fill me-2" id="toastIcon"></i>
        <strong class="me-auto" id="toastTitle">Notification</strong>
        <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
      </div>
      <div class="toast-body" id="toastMessage"></div>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const API_URL = 'http://localhost:5000';
    const form = document.getElementById('signupForm');
    const signupBtn = document.getElementById('signupBtn');
    const toastEl = document.getElementById('liveToast');
    const toast = new bootstrap.Toast(toastEl);

    // Form validation
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      if (!form.checkValidity()) {
        e.stopPropagation();
        form.classList.add('was-validated');
        Array.from(form.querySelectorAll('.form-control:invalid')).forEach(input => {
          input.classList.add('auth-shake');
          setTimeout(() => input.classList.remove('auth-shake'), 500);
        });
        return;
      }

      // Show loading
      const originalText = signupBtn.innerHTML;
      signupBtn.classList.add('auth-loading');
      signupBtn.disabled = true;
      signupBtn.innerHTML = '<span>Creating account...</span>';

      const user = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
      };

      try {
        const response = await fetch(API_URL + '/Users', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(user)
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Failed to create account');
        }

        // Store user in localStorage
        localStorage.setItem("user", JSON.stringify(data));
        
        showToast('Success!', 'Account created successfully! Redirecting to login...', 'success');
        signupBtn.classList.add('auth-success');
        
        setTimeout(() => {
          window.location.href = 'login.html';
        }, 1500);
      } catch (error) {
        showToast('Error', error.message, 'error');
        Array.from(form.querySelectorAll('.form-control')).forEach(input => {
          input.classList.add('auth-shake');
          setTimeout(() => input.classList.remove('auth-shake'), 500);
        });
      } finally {
        signupBtn.classList.remove('auth-loading');
        signupBtn.disabled = false;
        signupBtn.innerHTML = originalText;
      }
    });

    // Password toggle
    function togglePassword(id) {
      const input = document.getElementById(id);
      const icon = document.getElementById('toggleIconPassword');
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'bi bi-eye-slash';
      } else {
        input.type = 'password';
        icon.className = 'bi bi-eye';
      }
    }

    // Toast helper
    function showToast(title, message, type = 'info') {
      const toastIcon = document.getElementById('toastIcon');
      const toastTitle = document.getElementById('toastTitle');
      const toastMessage = document.getElementById('toastMessage');

      const icons = {
        success: 'bi-check-circle-fill text-success',
        error: 'bi-x-circle-fill text-danger',
        info: 'bi-info-circle-fill text-info'
      };

      toastIcon.className = `bi ${icons[type] || icons.info} me-2`;
      toastTitle.textContent = title;
      toastMessage.textContent = message;
      toast.show();
    }

    // Input focus effects
    document.querySelectorAll('.form-control').forEach(input => {
      input.addEventListener('focus', () => input.parentElement.classList.add('focused'));
      input.addEventListener('blur', () => input.parentElement.classList.remove('focused'));
    });
  </script>
</body>
</html>
